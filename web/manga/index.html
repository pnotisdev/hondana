<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manga · Hondana</title>
<link rel="stylesheet" href="/books/lookups.css">
<script src="/books/lookups.js"></script>
<style>
  :root {
    --bg: #060606;
    --bg-raised: #131313;
    --panel: #0e0e0e;
    --border: #1f1f1f;
    --text: #ededed;
    --text-dim: #8a8a8a;
    --accent: #4ade80;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  /* Japanese fonts are listed so kanji in titles don't fall back to Chinese glyph forms. */
  body { font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Noto Sans CJK JP", Meiryo, system-ui, Arial, sans-serif; font-size: 14px; }
  a { color: inherit; }

  /* top bar */
  .topbar { border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .topbar-in {
    max-width: 1200px; margin: 0 auto; padding: 0 20px; height: 54px;
    display: flex; align-items: center; gap: 14px;
  }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; margin-right: 6px; }
  .tab { padding: 6px 10px; border-radius: var(--radius); background: var(--bg-raised); font-size: 14px; text-decoration: none; }
  .spacer { flex: 1; }
  #search {
    font: inherit; width: 220px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px;
  }
  #search:focus { outline: 1px solid #444; }
  #search::placeholder { color: var(--text-dim); }
  .ghost { font: inherit; font-size: 12px; color: var(--text-dim); background: none; border: 0; cursor: pointer; padding: 6px; }
  .ghost:hover { color: var(--text); }
  #sortSel { font: inherit; font-size: 12px; color: var(--text-dim); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 8px; cursor: pointer; }

  /* page */
  .page { max-width: 1200px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--text-dim); font-size: 12.5px; margin-bottom: 30px; }
  .row-head { font-size: 15px; font-weight: 500; margin: 0 0 14px; }
  .row-head small { color: var(--text-dim); font-weight: 400; margin-left: 6px; font-size: 12px; }
  .row {
    display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 30px;
    scrollbar-width: thin; scrollbar-color: #2a2a2a transparent;
  }
  .card { flex: 0 0 150px; width: 150px; cursor: pointer; }
  .cover-wrap {
    position: relative; aspect-ratio: 2 / 3; background: var(--bg-raised);
    border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border);
    transition: transform .15s, border-color .15s;
  }
  .card:hover .cover-wrap { transform: translateY(-2px); border-color: #444; }
  .card.sel .cover-wrap { border-color: var(--text); }
  .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-wrap.unready img { filter: grayscale(.8) brightness(.6); }
  .cover-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--text-dim); }
  .ratio { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(0,0,0,.6); }
  .ratio-fill { height: 100%; background: var(--accent); }
  .title {
    font-size: 14px; font-weight: 500; line-height: 1.4; margin: 8px 0 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta { font-size: 11.5px; color: var(--text-dim); }
  .empty { text-align: center; color: var(--text-dim); margin: 60px 0; }

  /* side panel */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw);
    background: var(--panel); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform .2s; z-index: 10;
    display: flex; flex-direction: column;
  }
  .panel.open { transform: none; }
  html:has(.panel.open) { overflow: hidden; } /* only the panel scrolls while it is open */
  .panel-close { position: absolute; top: 14px; right: 16px; font-size: 22px; line-height: 1; z-index: 2; }
  .panel-body { overflow-y: auto; padding: 24px; flex: 1; }
  .p-top { display: flex; gap: 18px; margin-bottom: 22px; padding-right: 24px; }
  .p-top img, .p-top .cover-fallback { width: 112px; height: 168px; object-fit: cover; border-radius: var(--radius); background: var(--bg-raised); flex: none; }
  .p-title { font-size: 19px; font-weight: 600; margin: 2px 0 8px; line-height: 1.25; }
  .p-line { color: var(--text-dim); font-size: 13px; margin-bottom: 6px; }
  .p-line a { color: var(--text); }
  .p-bar { height: 4px; background: var(--bg-raised); border-radius: 2px; overflow: hidden; margin: 12px 0 0; }
  .p-section { border-top: 1px solid var(--border); padding-top: 18px; margin-top: 8px; }
  .p-section h3 { font-size: 14px; font-weight: 600; margin: 0 0 12px; }
  .summary { margin: 0; font-size: 13.5px; line-height: 1.7; white-space: pre-line; overflow-wrap: anywhere; }
  .vol-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .vol {
    padding: 7px 12px; border-radius: var(--radius); font-size: 13px; text-decoration: none;
    border: 1px solid var(--border); background: var(--bg-raised);
  }
  a.vol:hover { border-color: #555; }
  .vol small { color: var(--text-dim); margin-left: 6px; font-size: 11.5px; }
  span.vol { color: #555; }
  .panel-foot { border-top: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 18px; }
  .btn { background: #f2f2f2; color: #000; font-weight: 500; text-decoration: none; padding: 9px 16px; border-radius: var(--radius); font-size: 14px; }
  .btn.off { background: var(--bg-raised); color: #555; pointer-events: none; }
  .link { color: var(--text-dim); text-decoration: none; font-size: 13.5px; }
  .link:hover { color: var(--text); }
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <span class="brand">Hondana</span>
  <span class="tab">Manga</span>
  <a class="tab" href="/books/">Books</a>
  <a class="tab" href="/settings/">Settings</a>
  <span class="spacer"></span>
  <input id="search" type="text" placeholder="Search manga">
  <select id="sortSel" aria-label="Sort manga" title="Order of the series in each row">
    <option value="name">Sort: name</option><option value="known">Sort: most words known</option>
    <option value="jiten">Sort: Jiten, easiest first</option><option value="natively">Sort: Natively level</option>
  </select>
  <button class="ghost" id="refreshBtn">Refresh</button>
</div></div>

<div class="page">
  <h1>What to read</h1>
  <div class="sub" id="totalStat">Loading…</div>
  <div id="rows"></div>
  <div class="empty" id="emptyMsg" style="display:none">Nothing found.</div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-hidden="true">
  <button class="ghost panel-close" id="panelClose" aria-label="Close">×</button>
  <div class="panel-body" id="panelBody"></div>
  <div class="panel-foot" id="panelFoot"></div>
</aside>

<script>
const VOL_EXTS = [".cbz", ".zip", ".html", ".mokuro"];

let library = [];            // [{name, vols}]
let selected = null;         // series name shown in the panel
const infos = new Map();      // series -> {jiten, natively}: answers of /api/lookup
const knownWords = new Map(); // series -> /api/known-words result | null

function stemOf(name) {
  for (const ext of VOL_EXTS) {
    if (name.toLowerCase().endsWith(ext)) return name.slice(0, -ext.length);
  }
  return name;
}
function naturalCompare(a, b) { return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" }); }
function longestCommonPrefixLen(strings) {
  if (!strings.length) return 0;
  let prefix = strings[0];
  for (const s of strings.slice(1)) {
    let i = 0;
    while (i < prefix.length && i < s.length && prefix[i] === s[i]) i++;
    prefix = prefix.slice(0, i);
    if (!prefix) break;
  }
  while (prefix.length && /\d/.test(prefix[prefix.length - 1])) prefix = prefix.slice(0, -1);
  return prefix.length;
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const thumbSrc = name => "/api/thumbnail?series=" + encodeURIComponent(name);

async function fetchDir(relPath) {
  const res = await fetch("/api/listing?path=" + encodeURIComponent(relPath));
  if (!res.ok) throw new Error("fetch failed: " + relPath);
  return res.json();
}

async function loadSeries(seriesName) {
  const entries = await fetchDir(seriesName);
  const stems = new Map();
  for (const e of entries) {
    if (e.name === "_ocr") continue;
    const stem = e.isDir ? e.name : stemOf(e.name);
    if (!stems.has(stem)) stems.set(stem, { ready: false, htmlHref: null });
    if (!e.isDir && e.name.toLowerCase().endsWith(".html")) {
      stems.get(stem).ready = true;
      stems.get(stem).htmlHref = encodeURIComponent(seriesName) + "/" + encodeURIComponent(e.name);
    }
  }
  return Array.from(stems.entries())
    .map(([stem, info]) => ({ stem, ...info }))
    .sort((a, b) => naturalCompare(a.stem, b.stem));
}

function stats(vols) {
  const total = vols.length, ready = vols.filter(v => v.ready).length;
  return { total, ready, pct: total ? Math.round(ready / total * 100) : 0 };
}

function diffText(name) {
  return Lookups.badges(infos.get(name));
}

const percent = (part, whole) => whole ? Math.round(part / whole * 100) : 0;
function knownText(name) {
  const k = knownWords.get(name);
  if (!k?.series) return k?.ankiOffline ? "Anki offline" : "";
  if (!k.series.words) return "";
  return `${percent(k.series.known, k.series.words)}% known` + (k.ankiOffline ? " · Anki offline" : "");
}
function knownSection(k) {
  if (!k) return "";
  if (!k.series) return k.ankiOffline ? `<div class="p-section"><h3>Known words</h3><div class="p-line">Anki offline: start Anki to see how many of these words you know.</div></div>` : "";
  const c = k.series;
  if (!c.words) return "";
  const offline = k.ankiOffline ? `; Anki offline, so this uses the list from ${escapeHtml(new Date(k.wordsAt * 1000).toLocaleString())}` : "";
  return `<div class="p-section"><h3>Known words</h3>
    <div class="p-line"><b>${percent(c.known, c.words)}%</b> of running words · ${percent(c.uniqueKnown, c.unique)}% of ${c.unique.toLocaleString()} different words${c.learning ? ` · ${percent(c.learning, c.words)}% still learning` : ""}</div>
    <div class="p-line">Compared with ${k.knownWords.toLocaleString()} words at an Anki interval of ${k.knownInterval ?? 21} days or more${offline}. Particles and auxiliaries count as known.</div></div>`;
}

const SORTS = ["name", "known", "jiten", "natively"];
let sortMode = "name";
try {
  const saved = localStorage.getItem("manga-sort");
  sortMode = saved === "difficulty" ? "jiten" : SORTS.includes(saved) ? saved : "name";
} catch (e) { /* storage blocked: default sort */ }

function renderCard({ name, vols }) {
  const { total, ready, pct } = stats(vols);
  const card = document.createElement("div");
  card.className = "card" + (name === selected ? " sel" : "");
  card.dataset.name = name;
  card.innerHTML = `
    <div class="cover-wrap${ready ? "" : " unready"}">
      <img src="${thumbSrc(name)}" alt="" loading="lazy"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'cover-fallback',textContent:this.dataset.fb}))"
           data-fb="${escapeHtml(name.slice(0, 2))}">
      <div class="ratio"><div class="ratio-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="title" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
    <div class="meta"><span class="count">${ready} / ${total} vols</span><span class="diff"> ${escapeHtml(diffText(name) ? "· " + diffText(name) : "")}</span></div>
    <div class="meta known" title="Share of the running words you know in Anki">${escapeHtml(knownText(name))}</div>`;
  card.addEventListener("click", () => openPanel(name));
  return card;
}

function renderRows() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const items = library.filter(s => !q || s.name.toLowerCase().includes(q));
  // Unrated series sort last; ties keep name order.
  const value = s => {
    if (sortMode === "known") {
      const c = knownWords.get(s.name)?.series;
      return c?.words ? -c.known / c.words : 1;
    }
    return Lookups.level(sortMode, infos.get(s.name)?.[sortMode]) ?? Infinity;
  };
  if (sortMode !== "name") items.sort((a, b) => value(a) - value(b));
  const groups = [
    ["Ready to read", "Every volume processed", items.filter(s => s.vols.length && stats(s.vols).ready === s.vols.length)],
    ["In progress", "Some volumes still need OCR", items.filter(s => { const t = stats(s.vols); return t.ready > 0 && t.ready < t.total; })],
    ["Not processed yet", "No readable volumes", items.filter(s => stats(s.vols).ready === 0)],
  ];
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  for (const [title, hint, list] of groups) {
    if (!list.length) continue;
    const head = document.createElement("div");
    head.className = "row-head";
    head.innerHTML = `${title}<small>${hint}</small>`;
    const row = document.createElement("div");
    row.className = "row";
    list.forEach(s => row.appendChild(renderCard(s)));
    rows.append(head, row);
  }
  document.getElementById("emptyMsg").style.display = items.length ? "none" : "block";
}

function openPanel(name) {
  selected = name;
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("sel", c.dataset.name === name));
  fillPanel();
  document.getElementById("panel").classList.add("open");
  document.getElementById("scrim").classList.add("open");
  document.getElementById("panel").setAttribute("aria-hidden", "false");
}
function closePanel() {
  selected = null;
  document.querySelectorAll(".card.sel").forEach(c => c.classList.remove("sel"));
  document.getElementById("panel").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
  document.getElementById("panel").setAttribute("aria-hidden", "true");
}

function fillPanel() {
  const s = library.find(x => x.name === selected);
  if (!s) return closePanel();
  const { total, ready, pct } = stats(s.vols);
  const pre = s.vols.length > 1 ? longestCommonPrefixLen(s.vols.map(v => v.stem)) : 0;
  const k = knownWords.get(s.name);
  const volKnown = new Map((k?.volumes || []).map(v => [v.name, v]));
  const found = infos.get(s.name) || {};
  const jitenVolumes = found.jiten?.result?.volumes || [];
  const volsHtml = s.vols.map(v => {
    const label = escapeHtml(v.stem.slice(pre).trim() || v.stem);
    const kv = volKnown.get(v.stem);
    const known = kv?.words ? `<small title="Running words you know">${percent(kv.known, kv.words)}%</small>` : "";
    const jv = jitenVolumes.find(entry => entry.number === volumeNumber(v.stem));
    const tip = jv?.difficulty != null ? `Jiten difficulty of this volume: ${jv.difficulty.toFixed(1)}` : "";
    return v.ready ? `<a class="vol" href="${v.htmlHref}" target="_blank" rel="noopener" title="${escapeHtml(tip)}">${label}${known}</a>` : `<span class="vol" title="Not processed">${label}</span>`;
  }).join("");
  const first = s.vols.find(v => v.ready);
  document.getElementById("panelBody").innerHTML = `
    <div class="p-top">
      <img src="${thumbSrc(s.name)}" alt="" onerror="this.style.visibility='hidden'">
      <div>
        <div class="p-title">${escapeHtml(s.name)}</div>
        <div class="p-line">${ready} of ${total} volumes ready</div>
        <div class="p-line">${escapeHtml(Lookups.badges(found))}</div>
        <div class="p-bar"><div class="ratio-fill" style="width:${pct}%;height:100%"></div></div>
      </div>
    </div>
    ${knownSection(k)}
    <div class="p-section lookups" id="lookupSection" hidden></div>
    ${found.jiten?.result?.description ? `<div class="p-section"><h3>Summary</h3><p class="summary">${escapeHtml(found.jiten.result.description)}</p></div>` : ""}
    <div class="p-section"><h3>Volumes</h3><div class="vol-grid">${volsHtml || '<span class="p-line">None</span>'}</div></div>`;
  document.getElementById("panelFoot").innerHTML =
    `<a class="btn${first ? "" : " off"}" ${first ? `href="${first.htmlHref}" target="_blank" rel="noopener"` : ""}>Start reading</a>`;
  Lookups.renderSection(document.getElementById("lookupSection"), "manga", s.name, found, (source, info) => {
    infos.set(s.name, { ...infos.get(s.name), [source]: info });
    const card = document.querySelector(`.card[data-name="${CSS.escape(s.name)}"] .diff`);
    if (card) card.textContent = diffText(s.name) ? " · " + diffText(s.name) : "";
    if (selected === s.name) fillPanel();
  });
}

// The number of a volume's file or folder name ("Yotsubato v03" is 3), to find its Jiten volume.
function volumeNumber(stem) {
  const numbers = stem.match(/\d+(?:\.\d+)?/g);
  return numbers ? Number(numbers[numbers.length - 1]) : null;
}

// Redraws the open panel for new information, unless a link is being typed into its "Wrong title?" form.
function refreshPanel(name) {
  if (name === selected && !document.querySelector("#lookupSection .lookup-fix[open]")) fillPanel();
}

let resortTimer;
function loadLookups() {
  const todo = library.map(s => s.name).filter(name => !infos.has(name));
  for (const name of todo) infos.set(name, {});
  return Lookups.lookupAll(todo, "manga", name => name, (name, source, info) => {
    infos.set(name, { ...infos.get(name), [source]: info });
    const card = document.querySelector(`.card[data-name="${CSS.escape(name)}"] .diff`);
    if (card) card.textContent = diffText(name) ? " · " + diffText(name) : "";
    refreshPanel(name);
    if (sortMode === source) {
      clearTimeout(resortTimer);
      resortTimer = setTimeout(renderRows, 800);
    }
  });
}

async function loadKnownWords() {
  // Every time: the server caches each volume, and the Anki list changes as cards mature.
  const todo = library.filter(s => stats(s.vols).ready).map(s => s.name);
  let i = 0;
  async function worker() {
    while (i < todo.length) {
      const name = todo[i++];
      let value = null;
      try {
        const res = await fetch("/api/known-words?series=" + encodeURIComponent(name));
        value = res.ok ? await res.json() : null;
      } catch (e) { /* server stopped: shown without known words */ }
      knownWords.set(name, value);
      const el = document.querySelector(`.card[data-name="${CSS.escape(name)}"] .known`);
      if (el) el.textContent = knownText(name);
      refreshPanel(name);
    }
  }
  // Two at a time: a volume seen for the first time takes about a second to count.
  await Promise.all(Array.from({ length: 2 }, worker));
}

let librarySignature = "";
async function build() {
  try {
    const rootEntries = await fetchDir("");
    const dirs = rootEntries.filter(e => e.isDir).sort((a, b) => naturalCompare(a.name, b.name));
    const next = await Promise.all(dirs.map(async d => {
      try { return { name: d.name, vols: await loadSeries(d.name) }; }
      catch (e) { return { name: d.name, vols: [] }; }
    }));
    // The timed refresh redraws only when files changed, so scrolled rows and covers stay put.
    const signature = JSON.stringify(next);
    if (signature === librarySignature) return;
    librarySignature = signature;
    library = next;
    const ready = library.reduce((n, s) => n + stats(s.vols).ready, 0);
    const total = library.reduce((n, s) => n + s.vols.length, 0);
    document.getElementById("totalStat").textContent = `${library.length} series · ${ready} / ${total} volumes ready`;
    renderRows();
    if (selected) fillPanel();
    loadLookups();
    loadKnownWords();
  } catch (error) {
    librarySignature = ""; // the next successful load replaces this message
    document.getElementById("totalStat").textContent = "Could not load the manga library. Check the manga folder and server console.";
    console.error("Could not load the manga library:", error);
  }
}

document.getElementById("search").addEventListener("input", renderRows);
document.getElementById("refreshBtn").addEventListener("click", () => { librarySignature = ""; build(); });
const sortSel = document.getElementById("sortSel");
sortSel.value = sortMode;
sortSel.addEventListener("change", () => {
  sortMode = SORTS.includes(sortSel.value) ? sortSel.value : "name";
  try { localStorage.setItem("manga-sort", sortMode); } catch (e) { /* choice lasts for this page only */ }
  renderRows();
});
document.getElementById("panelClose").addEventListener("click", closePanel);
document.getElementById("scrim").addEventListener("click", closePanel);
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

build();
setInterval(build, 60000);
</script>
</body>
</html>
